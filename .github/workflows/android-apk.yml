name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      variant:
        description: "Type de build"
        required: true
        default: release
        type: choice
        options: [release, debug]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/share/swift /opt/ghc 2>/dev/null || true
          df -h /

      - name: Préparer le SDK Android
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            # Best effort : Gradle télécharge de toute façon les composants manquants.
            "$SDKM" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true
          else
            echo "::warning::sdkmanager introuvable, on utilise le SDK préinstallé du runner."
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Installer les dépendances npm
        run: npm ci --no-audit --no-fund

      - name: Vérification TypeScript (non bloquant)
        run: npx tsc --noEmit || echo "::warning::Le typecheck a signalé des erreurs (build poursuivi)."

      - name: Générer le projet natif Android (Expo prebuild)
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          npx expo prebuild --platform android --clean --no-install
          # Plus de mémoire pour Gradle (les builds React Native sont gourmands).
          # (le fichier généré ne finit pas toujours par un saut de ligne)
          printf '\n' >> android/gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.caching=true"
          } >> android/gradle.properties
          echo "--- gradle.properties (fin de fichier) ---"
          tail -n 5 android/gradle.properties

      - name: Mettre en cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        working-directory: android
        env:
          EXPO_NO_TELEMETRY: 1
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          set -o pipefail
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          if [ "$VARIANT" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace --build-cache
          fi

      - name: Préparer l'APK
        id: apk
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          if [ "$VARIANT" = "debug" ]; then
            SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          else
            SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          fi
          if [ -z "${SRC:-}" ]; then
            echo "::error::Aucun APK trouvé après la compilation."
            find android/app/build/outputs -type f || true
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          NAME="movibot-${VERSION}-${VARIANT}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "dist/$NAME"

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: movibot-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attacher l'APK à la release (si tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
